name: "ARC git credentials"
description: >
  A GITHUB_TOKEN for nix's github: fetches, so they aren't rate-limited -- the
  whole worker fleet NATs through one IP. Unlike the language servers' arc_env
  this sets no NIX_PATH; the test step sets it from tests/flake.nix's own pin.

runs:
  using: "composite"
  steps:
    - name: Authenticate nix's github fetches
      shell: bash
      run: |
        # Writing to GITHUB_ENV replaces, so preserve any existing NIX_CONFIG.
        {
          echo "NIX_CONFIG<<NIX_CONFIG_EOF"
          if [[ -n "${NIX_CONFIG:-}" ]]; then echo "$NIX_CONFIG"; fi
          echo "access-tokens = github.com=${{ github.token }}"
          echo "NIX_CONFIG_EOF"
        } >> "$GITHUB_ENV"
