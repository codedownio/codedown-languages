name: codedown-languages

on:
  push:
  workflow_dispatch:

# Linux runs on the credential-free ARC pools (codedown's arc.nix); macOS stays
# on mac1's self-hosted runners, since the cluster has no macOS nodes.
jobs:
  verify-nixpkgs-revs:
    name: "verify-nixpkgs-revs (${{matrix.os}})"
    runs-on: ${{ matrix.os == 'Linux' && 'arc-public-small' || 'macOS' }}
    strategy:
      fail-fast: false
      matrix:
        # `nomac` in the commit message drops the macOS legs, the way codedown's
        # tests.yml does; job-level `if` can't see the matrix context.
        os: ${{ fromJSON(contains(github.event.head_commit.message, 'nomac') && '["Linux"]' || '["macOS","Linux"]') }}

    steps:
    - uses: actions/checkout@v6

    - uses: ./.github/actions/arc_git_creds

    - name: verify-default-nix.sh
      if: "!contains(github.event.head_commit.message, 'noci')"
      run: ./.aliases/dev-verify-default-nix

  lint-nix:
    name: "lint-nix"
    runs-on: arc-public-small

    steps:
    - uses: actions/checkout@v6

    - uses: ./.github/actions/arc_git_creds

    - name: nix build .#checks.x86_64-linux.lint-nix
      if: "!contains(github.event.head_commit.message, 'noci')"
      run: nix build --no-link -L .#checks.x86_64-linux.lint-nix

  nix-flake-check:
    name: "nix-flake-check (${{matrix.os}})"
    # medium, not small: the flake eval alone outgrew 4Gi.
    runs-on: ${{ matrix.os == 'Linux' && 'arc-public-medium' || 'macOS' }}
    strategy:
      fail-fast: false
      matrix:
        # `nomac` in the commit message drops the macOS legs, the way codedown's
        # tests.yml does; job-level `if` can't see the matrix context.
        os: ${{ fromJSON(contains(github.event.head_commit.message, 'nomac') && '["Linux"]' || '["macOS","Linux"]') }}

    steps:
    - uses: actions/checkout@v6

    - uses: ./.github/actions/arc_git_creds

    - name: nix flake check
      if: "!contains(github.event.head_commit.message, 'noci')"
      run: nix flake check

  build-ui-metadata:
    name: "build-ui-metadata (${{matrix.target.os}}, ${{matrix.target.arch}})"
    runs-on: ${{ matrix.target.os == 'Linux' && 'arc-public-small' || 'macOS' }}
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(contains(github.event.head_commit.message, 'nomac') && '[{"os":"Linux","arch":"x86_64-linux"},{"os":"Linux","arch":"aarch64-linux"}]' || '[{"os":"macOS","arch":"aarch64-darwin"},{"os":"Linux","arch":"x86_64-linux"},{"os":"Linux","arch":"aarch64-linux"}]') }}

    steps:
    - uses: actions/checkout@v6

    - uses: ./.github/actions/arc_git_creds

    - name: Build .#ui_metadata_farm
      if: "!contains(github.event.head_commit.message, 'noci')"
      run: |
        nix build .#packages.${{matrix.target.arch}}.ui_metadata_farm

  build-sample-environments:
    name: "build-sample-environments (${{matrix.target.os}}, ${{matrix.target.arch}})"
    runs-on: ${{ matrix.target.os == 'Linux' && 'arc-public-small' || 'macOS' }}
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(contains(github.event.head_commit.message, 'nomac') && '[{"os":"Linux","arch":"x86_64-linux"},{"os":"Linux","arch":"aarch64-linux"}]' || '[{"os":"macOS","arch":"aarch64-darwin"},{"os":"Linux","arch":"x86_64-linux"},{"os":"Linux","arch":"aarch64-linux"}]') }}

    steps:
    - uses: actions/checkout@v6

    - uses: ./.github/actions/arc_git_creds

    - name: Build .#sample_environments_farm
      if: "!contains(github.event.head_commit.message, 'noci')"
      run: |
        nix build .#packages.${{matrix.target.arch}}.sample_environments_farm

  test:
    name: ${{ matrix.suite.name }} (${{ matrix.os }}${{ matrix.suite.flags && format(', {0}', matrix.suite.flags) || '' }})
    # Per-suite `pool`: the language servers are what use the pod's memory, since
    # nix builds go to the host daemon outside the cgroup.
    runs-on: ${{ matrix.os == 'Linux' && matrix.suite.pool || 'macOS' }}
    strategy:
      fail-fast: false
      matrix:
        suite:
        - name: bash
          pool: arc-public-medium
        - name: clojure
          pool: arc-public-medium
        - name: coq
          pool: arc-public-medium
        - name: cpp
          pool: arc-public-medium
        - name: go
          pool: arc-public-medium
        - name: haskell
          flags: "-f ghc96"
          pool: arc-public-large
        - name: haskell
          flags: "-f ghc98"
          pool: arc-public-large
        - name: haskell
          flags: "-f ghc910"
          pool: arc-public-large
        - name: haskell
          flags: "-f ghc912"
          pool: arc-public-large
        - name: java
          pool: arc-public-large
        - name: julia
          flags: "-f julia_19"
          pool: arc-public-medium
        - name: julia
          flags: "-f julia_110"
          pool: arc-public-medium
        - name: julia
          flags: "-f julia_111"
          pool: arc-public-medium
        - name: julia
          flags: "-f julia_112"
          pool: arc-public-medium
        - name: octave
          pool: arc-public-medium
        - name: postgres
          pool: arc-public-medium
        - name: python
          pool: arc-public-medium
        - name: r
          pool: arc-public-medium
        - name: ruby
          pool: arc-public-medium
        - name: rust
          pool: arc-public-large
        - name: zsh
          pool: arc-public-medium
        - name: spellchecker
          pool: arc-public-medium
        - name: typst
          pool: arc-public-medium

        - name: exporters
          pool: arc-public-medium
        - name: sample-environments
          pool: arc-public-medium
        - name: searchers
          pool: arc-public-medium
        - name: settings-schemas
          pool: arc-public-medium
        os: ${{ fromJSON(contains(github.event.head_commit.message, 'nomac') && '["Linux"]' || '["macOS","Linux"]') }}
    steps:
    - uses: actions/checkout@v6
      with:
        submodules: recursive

    - uses: ./.github/actions/arc_git_creds

    - name: Build tests
      if: "!contains(github.event.head_commit.message, 'noci')"
      run: |
        cd tests

        nix build .#tests

    - name: Run tests
      if: "!contains(github.event.head_commit.message, 'noci')"
      run: |
        cd tests

        TESTS=$(nix build --no-link .#tests --json | jq -r '.[0].outputs.out')/bin/tests

        # Not the workspace: on a pod that's the container's writable layer.
        export TEST_ROOT="$RUNNER_TEMP/test_root"
        mkdir -p "$TEST_ROOT"
        echo "Got TEST_ROOT: $TEST_ROOT"
        echo TEST_ROOT="$TEST_ROOT" >> $GITHUB_ENV

        export NIX_PATH=nixpkgs=$(nix run .#nixpkgsPath)

        "$TESTS" \
          --print \
          --fixed-root "$TEST_ROOT" \
          --markdown-summary "$GITHUB_STEP_SUMMARY" \
          --${{matrix.suite.name}} ${{matrix.suite.flags}}

    # Upload-only key, held only in the org secret; ciartifacts' authorized_keys
    # forces a receive-tarball command, so it grants nothing else.
    - name: Upload test artifacts (Linux)
      if: always() && runner.os != 'macOS'
      continue-on-error: true
      env:
        KEY: ${{ secrets.CI_ARTIFACTS_KEY }}
      run: |
        [[ -n "$TEST_ROOT" && -d "$TEST_ROOT" ]] || exit 0
        if [[ -z "$KEY" ]]; then
          echo "No CI_ARTIFACTS_KEY in this context; skipping upload"
          exit 0
        fi

        install -m 700 -d "$HOME/.ssh-upload"
        printf '%s\n' "$KEY" > "$HOME/.ssh-upload/id_ed25519"
        chmod 600 "$HOME/.ssh-upload/id_ed25519"

        REL="${{github.workflow}}_${{github.run_number}}/${{matrix.suite.name}}-${{matrix.suite.flags}}-Linux"
        REL="${REL// /_}"
        echo "REL: $REL"

        tar czf - -C "$TEST_ROOT" \
          --exclude=./.cache \
          --exclude=./.eclipse \
          --exclude='./postgres-nix-*/db' \
          . \
        | ssh -i "$HOME/.ssh-upload/id_ed25519" -o IdentitiesOnly=yes -o BatchMode=yes \
              -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=/dev/null \
              -o ConnectTimeout=15 ciartifacts@192.168.1.66 "$REL" \
          && echo "Uploaded artifacts to ciartifacts@mac1:$REL" \
          || echo "::warning::artifact upload to mac1 failed"

    - name: Save test artifacts (macOS)
      if: always() && runner.os == 'macOS'
      continue-on-error: true
      shell: bash
      run: |
        DEST="/Users/tester/all_test_runs/languages_${{github.workflow}}_${{github.run_number}}/${{matrix.suite.name}}-${{matrix.suite.flags}}"
        DEST="${DEST// /_}"
        echo "DEST: $DEST"
        if [[ -n "$TEST_ROOT" ]]; then
          rsync \
            -azW --mkpath \
            --exclude=".cache/" \
            --exclude=".eclipse/" \
            --exclude="postgres-nix-*/db/" \
            "$TEST_ROOT/" \
            "$DEST"
        fi
